name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (YYYY.1MMdd.1HHmm). Leave empty to use the current UTC time."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
      version_package: ${{ steps.version.outputs.VersionPackage }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Resolve build number
        id: build
        shell: bash
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          BUILD_REASON: ${{ github.event_name == 'push' && 'Merge' || (github.event_name == 'pull_request' && 'PullRequest' || 'Manual') }}
        run: |
          set -euo pipefail
          build_number="$INPUT_BUILD_NUMBER"
          if [ -z "$build_number" ]; then
            build_number="$(date -u +'%Y.1%m%d.1%H%M')"
          fi
          if ! [[ "$build_number" =~ ^[0-9]{4}\.1[0-9]{4}\.1[0-9]{4}$ ]]; then
            echo "::error::Invalid build number '$build_number'. Expected YYYY.1MMdd.1HHmm."
            exit 1
          fi
          echo "Build number: $build_number ($BUILD_REASON)"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "build_reason=$BUILD_REASON" >> "$GITHUB_OUTPUT"

      - name: Derive version variables
        id: version
        shell: bash
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.build_number }}
          BUILD_REASON: ${{ steps.build.outputs.build_reason }}
        run: |
          set -euo pipefail
          version_informational="$BUILD_NUMBER"
          if [ "$BUILD_REASON" = "PullRequest" ]; then
            version_package="${version_informational}-preview"
          else
            version_package="$version_informational"
          fi
          echo "VersionInformational=$version_informational" >> "$GITHUB_OUTPUT"
          echo "VersionNumber=${version_informational}.0" >> "$GITHUB_OUTPUT"
          echo "VersionPackage=$version_package" >> "$GITHUB_OUTPUT"
          echo "Package version: $version_package"

      # The committed version is a development baseline. Every CI build packages
      # the derived version, so releases never require a version-bump commit.
      - name: Set package version
        run: npm version "${{ steps.version.outputs.VersionPackage }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run compile

      - name: Extension tests
        run: npm test

      - name: .NET SDK
        run: dotnet --info

      - name: C# build and tests
        run: |
          dotnet build AIWorkspaceManager.slnx -c Release
          dotnet test AIWorkspaceManager.slnx -c Release --no-build

      - name: Build
        run: npm run build

      - name: Package and check VSIX size
        run: |
          mkdir -p releases
          npm run package
          SIZE=$(stat -c%s releases/aiworkspacemanager-*.vsix)
          echo "VSIX size: $SIZE bytes"
          # The framework-dependent .NET core is ~4.5 MB; the extension itself is under 1 MB.
          if [ "$SIZE" -gt 16777216 ]; then
            echo "::error::VSIX exceeds 16 MB"
            exit 1
          fi
          cp releases/aiworkspacemanager-*.vsix aiworkspacemanager.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: aiworkspacemanager.vsix
          if-no-files-found: error
